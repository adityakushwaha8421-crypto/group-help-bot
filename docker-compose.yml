services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: verifier
      POSTGRES_PASSWORD: verifier
      POSTGRES_DB: verifier
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifier"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://verifier:verifier@db:5432/verifier
    command: alembic upgrade head
    depends_on:
      db: { condition: service_healthy }

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://verifier:verifier@db:5432/verifier
      REDIS_URL: redis://redis:6379/0
      INLINE_JOBS: "false"
    command: python -m app.main
    ports: ["8080:8080"]
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://verifier:verifier@db:5432/verifier
      REDIS_URL: redis://redis:6379/0
      INLINE_JOBS: "false"
      ADMIN_HEADLESS: "true"
    command: arq app.workers.tasks.WorkerSettings
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
